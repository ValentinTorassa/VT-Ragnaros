name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19; change the image on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python3 -m compileall -q ragnaros daemon tools && python3 -m py_compile tools/ragnarosctl
      - run: bash -n install.sh && bash -n packaging/deb/build-deb.sh && bash -n packaging/aur/PKGBUILD
