# Perfil de ejemplo. Las rutas son de muestra: apuntalas a tus propios
# directorios. El daemon no valida que existan hasta que apretas la tecla.
name: work
strip:
  segments:
    - gifs/segments/auto_5LhLOxI5.gif
    - gifs/segments/auto_lpcor6sr.gif
    - gifs/segments/auto_l1zmfvFY.gif
    - gifs/segments/auto_LmA9KL1I.gif
  dashboard: [clock, cpu, ram, disk]
keys:
  "0":
    icon: icons/folder.png
    action: ghostty --working-directory=~/proyectos/trabajo
  "1":
    icon: icons/creatorstack.png
    action: ghostty --working-directory=~/proyectos/personal
  "2":
    icon: icons/codex.png
    action: ghostty -e codex
  "3":
    icon: icons/lazydocker.png
    action: ghostty -e lazydocker
  "4":
    icon: icons/awsvpn.png
    action: gtk-launch awsvpnclient
  "5":
    icon: icons/whatsapp.png
    action: whatsapp-linux-app
  "6":
    icon: icons/firefox.png
    action: firefox-esr
  "7":
    icon: icons/thunderbird.png
    action: thunderbird
  "8":
    icon: icons/aws.png
    action: xdg-open https://console.aws.amazon.com
  "9":
    icon: icons/switch_ai.gif
    profile: ai-tools
knobs:
  "0":
    rotate:
      cw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
      ccw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    press: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
  "1":
    rotate:
      cw: playerctl volume 0.05+
      ccw: playerctl volume 0.05-
    press: playerctl play-pause
  "2":
    rotate:
      cw: brightnessctl set 5%+
      ccw: brightnessctl set 5%-
    press: layer:media
  "3":
    rotate:
      cw: playerctl next
      ccw: playerctl previous
    press: playerctl play-pause

# a momentary media layer: hold-free toggle on knob 2, keys 5-8 fall through
# to the profile underneath
layers:
  media:
    keys:
      "0":
        icon: icons/media_prev.png
        action: playerctl previous
      "1":
        icon: icons/media_play.png
        action: playerctl play-pause
      "2":
        icon: icons/media_next.png
        action: playerctl next
      "3":
        icon: icons/media_vol.png
        action: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
      "4":
        icon: icons/dashboard.png
        action: dashboard
      "9":
        icon: icons/layers.png
        layer_toggle: media
