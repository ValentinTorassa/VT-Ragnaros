name: ai-tools
strip:
  segments:
    - gifs/segments/eva01.gif
    - gifs/segments/asuka.gif
    - gifs/segments/rei.gif
    - gifs/segments/shinji.gif
  dashboard: [clock, cpu, ram, net]
keys:
  "0":
    icon: icons/opencode.png
    action: ghostty -e opencode
  "1":
    icon: icons/claude.png
    action: ghostty -e claude
  "2":
    icon: icons/chatgpt.png
    action: xdg-open https://chat.openai.com
  "3":
    icon: icons/cursor.png
    action: cursor
  "4":
    icon: icons/zed.png
    action: zed
  "5":
    icon: icons/vscode.png
    action: code
  "6":
    icon: icons/github.png
    action: github-desktop
  "7":
    icon: icons/tmux.png
    action: ghostty -e tmux attach
  "8":
    icon: icons/dbeaver.png
    action: dbeaver-ce
  "9":
    icon: icons/switch_stream.png
    profile: stream
knobs:
  "0":
    rotate:
      cw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
      ccw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    press: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
  "1":
    rotate:
      cw: playerctl volume 0.05+
      ccw: playerctl volume 0.05-
    press: playerctl play-pause
  "2":
    rotate:
      cw: brightnessctl set 5%+
      ccw: brightnessctl set 5%-
    press: layer:media
  "3":
    rotate:
      cw: playerctl next
      ccw: playerctl previous
    press: playerctl play-pause

# a momentary media layer: hold-free toggle on knob 2, keys 5-8 fall through
# to the profile underneath
layers:
  media:
    keys:
      "0":
        icon: icons/media_prev.png
        action: playerctl previous
      "1":
        icon: icons/media_play.png
        action: playerctl play-pause
      "2":
        icon: icons/media_next.png
        action: playerctl next
      "3":
        icon: icons/media_vol.png
        action: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
      "4":
        icon: icons/dashboard.png
        action: dashboard
      "9":
        icon: icons/layers.png
        layer_toggle: media
