name: ai-tools
strip:
  gif: gifs/jjk.gif
keys:
  "0":
    icon: icons/opencode.png
    action: ghostty -e opencode
  "1":
    icon: icons/claude.png
    action: ghostty -e claude
  "2":
    icon: icons/aider.png
    action: ghostty -e aider
  "3":
    icon: icons/chatgpt.png
    action: xdg-open https://chat.openai.com
  "4":
    icon: icons/tmux.png
    action: ghostty -e tmux attach
  "5":
    icon: icons/whisper.png
    action: whisper-paste-toggle
  "6":
    icon: icons/tests.png
    action: ghostty -e sh -c "npm test; read"
  "7":
    icon: icons/git.png
    action: ghostty -e sh -c "git status; read"
  "8":
    icon: icons/clipboard.png
    action: sh -c "wl-paste | xclip -selection clipboard"
  "9":
    icon: icons/switch_stream.png
    profile: streaming
knobs:
  "0":
    rotate:
      cw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
      ccw: wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
    press: wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
  "3":
    rotate:
      cw: playerctl next
      ccw: playerctl previous
    press: playerctl play-pause
