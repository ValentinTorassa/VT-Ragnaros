name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python3 -m py_compile daemon/ragnarosd.py daemon/protocol.py daemon/renderer.py daemon/inputmap.py
      - run: bash -n install.sh
